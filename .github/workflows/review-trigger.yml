name: Trigger AI Reviews

# PR への push のたびに Codex のレビューを自動でリクエストする。
# @codex review のメンションコメントを bot として
# 投稿するだけで Claude 自体を GitHub Actions 上では動かさないため、CLAUDE_CODE_OAUTH_TOKEN や
# ANTHROPIC_API_KEY は不要。Claude 対応はローカル環境の Claude Code で行う想定。
#
# セットアップ:
#   Repository settings > Secrets and variables > Actions > New repository secret
#     Name : REVIEW_PAT
#     Value: 対象リポジトリに限定した fine-grained Personal Access Token。
#            必要な権限は「Issues: Read and write」のみ（PR コメント投稿は Issues 権限）。
#            classic PAT の repo スコープは権限が広すぎるため避ける。
#   ※ GITHUB_TOKEN で投稿すると bot 同士のメンションが意図どおり発火しないケースが
#     あるため、最小権限の fine-grained PAT を使う。

on:
  pull_request:
    types: [synchronize]

# REVIEW_PAT を明示的に渡して呼び出すので、暗黙の GITHUB_TOKEN に権限は不要。
permissions: {}

jobs:
  trigger-reviews:
    runs-on: ubuntu-latest
    # draft PR / fork PR はスキップ。fork PR は repository secret（REVIEW_PAT）が
    # 渡らないので即失敗してしまう（セキュリティ上の GitHub の仕様）。
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    steps:
      # REVIEW_PAT が未設定のリポジトリでも workflow 全体を fail させないよう、
      # 事前にシークレット存在チェックして未設定なら後続ステップをスキップする。
      - name: Check REVIEW_PAT
        id: check
        env:
          REVIEW_PAT: ${{ secrets.REVIEW_PAT }}
        run: |
          if [ -z "$REVIEW_PAT" ]; then
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning::REVIEW_PAT secret が未設定のため AI レビュー依頼をスキップします。Settings > Secrets に REVIEW_PAT を追加してください。"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request AI reviews
        if: steps.check.outputs.has_pat == 'true'
        # actions/github-script@v7
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.REVIEW_PAT }}
          script: |
            const pr = context.payload.pull_request.number;
            const repo = context.repo;
            const headSha = context.payload.pull_request.head.sha;

            // 冪等性ガード: 同じ head SHA に対して既にメンション済みの bot は
            // スキップする。workflow rerun / 途中失敗後の再実行で重複コメントが
            // 積まれて bot 側のレート制限や通知過多を起こすのを防ぐ。
            // HTML コメント形式の marker で「どの bot 用にトリガーしたか」を記録する。
            const commands = [
              { key: 'codex', body: '@codex review' },
            ];

            const existingComments = await github.paginate(
              github.rest.issues.listComments,
              { ...repo, issue_number: pr, per_page: 100 }
            );

            for (const { key, body } of commands) {
              const marker = `<!-- ai-review-trigger:${headSha}:${key} -->`;
              const alreadyTriggered = existingComments.some(c => c.body && c.body.includes(marker));
              if (alreadyTriggered) {
                console.log(`Skipping ${key}: marker already posted for ${headSha}`);
                continue;
              }

              await github.rest.issues.createComment({
                ...repo,
                issue_number: pr,
                body: `${body}\n\n${marker}`,
              });
              // レート制限対策で少し待つ
              await new Promise(r => setTimeout(r, 2000));
            }

name: Claude Auto Fix

# PR 上のコメントに `@claude` とメンションすると、Claude が自動で
# レビュー指摘への対応（調査・修正・コミット・push・返信）を行う。
#
# セットアップ:
#   1. ローカルで `claude setup-token` を実行して OAuth トークンを取得
#   2. リポジトリの Settings > Secrets and variables > Actions に
#      `CLAUDE_CODE_OAUTH_TOKEN` を登録
#   3. PR コメントで `@claude レビュー対応して` などと書くと発動
#
# 発動条件を `@claude` メンション限定にしているのは:
#   - コストコントロール（レビュー bot の自動再レビューで無限ループを防ぐ）
#   - 明示的な意図確認（意図しない修正コミットを防ぐ）

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Claude が PR 上で修正コミット＆push＆コメント返信を行うために必要な最小権限
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # `@claude` メンションが含まれる場合のみ起動（@claude-bot 等も許容）
    # bot 自身のコメントには反応しない（無限ループ防止）
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Run Claude Code
        # anthropics/claude-code-action@v1 (2026-04-18 時点の SHA 固定)
        uses: anthropics/claude-code-action@38ec876110f9fbf8b950c79f534430740c3ac009
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            この PR に付いた他のレビュー bot（Gemini / Codex / CodeRabbit 等）の
            コメントを確認し、妥当な指摘を修正してコミット & push してください。

            # 実行環境の制約
            このジョブは ubuntu-latest で動いています。本リポジトリは
            **Windows 専用プロジェクト（net10.0-windows8.0 / Native AOT）** のため、
            `dotnet build` / `dotnet test` は **ローカルで実行しないでください**
            （ubuntu では TargetFramework が解決できず失敗します）。
            push 後に別 workflow（dotnet-build.yml）が windows-latest 上で
            自動的にビルド＆テストを検証するので、そちらに委ねます。

            # ルール
            - コミットメッセージは日本語、CLAUDE.md の規約に従う
            - 指摘の妥当性を必ずコードを読んで検証してから修正する
            - 誤検知と判断した指摘はスキップし、PR コメントで理由を返信
            - 関連する複数の指摘はまとめて 1 コミットにする
            - 応答やコミットメッセージはクロちゃん口調（絵文字多め）で

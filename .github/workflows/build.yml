name: Build

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  build:
    env:
      KAGAYOI_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runtime: win-x64
            platform_target: x64
          - name: Windows ARM64
            runtime: win-arm64
            platform_target: ARM64
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.0.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      # 7z.dll は 1llum1n4t1s.Sevenzip NuGet パッケージに同梱された
      # runtimes/{rid}/native/7z.dll が dotnet publish 時に RID に応じて自動配置される。
      # 過去は 7-zip.org から直接ダウンロードしていたが、ハッシュ検証がなく
      # サプライチェーン攻撃リスクがあるため NuGet 経由に統一した。

      - name: 公開
        run: dotnet publish src/Lhamiel/Lhamiel.csproj -c Release -r ${{ matrix.runtime }} -p:PlatformTarget=${{ matrix.platform_target }} -o publish

      - name: 成果物を確認
        shell: pwsh
        run: |
          $exePath = Join-Path "publish" "Lhamiel.exe"
          $dllPath = Join-Path "publish" "7z.dll"
          if (-not (Test-Path $exePath)) { Write-Error "Lhamiel.exe not found"; exit 1 }
          if (-not (Test-Path $dllPath)) { Write-Error "7z.dll not found (NuGet runtimes/ から配置されているか要確認)"; exit 1 }
          Write-Host "Lhamiel.exe と 7z.dll (NuGet 同梱版) を確認完了"

      - name: 成果物をアップロード
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lhamiel.${{ matrix.runtime }}
          path: publish/*
          retention-days: 1

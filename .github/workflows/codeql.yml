name: CodeQL 解析

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # 毎週月曜 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: C# CodeQL 解析
    runs-on: windows-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v4.3.1
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: CodeQL を初期化
        # github/codeql-action/init@v4.35.3
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          languages: csharp
          build-mode: manual

      - name: ビルド
        run: dotnet build Lhamiel.slnx -c Release

      - name: CodeQL 解析を実行
        # github/codeql-action/analyze@v4.35.3
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa
        with:
          category: /language:csharp

name: .NET ビルド

on:
  pull_request:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

  test:
    name: テスト実行
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: x64 ビルド成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: lhamiel.win-x64
          path: publish

      - name: 7z.dll をテストプロジェクト用に配置
        shell: pwsh
        run: |
          $sevenZipVersion = "2600"
          $url = "https://www.7-zip.org/a/7z${sevenZipVersion}-x64.exe"
          $tempDir = Join-Path $env:RUNNER_TEMP "7z-extract"
          $installerPath = Join-Path $env:RUNNER_TEMP "7z-installer.exe"
          $targetDir = Join-Path "lib" "native" "win-x64"

          Invoke-WebRequest -Uri $url -OutFile $installerPath -UseBasicParsing
          & "C:\Program Files\7-Zip\7z.exe" x $installerPath -o"$tempDir" -y | Out-Null
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -Path (Join-Path $tempDir "7z.dll") -Destination (Join-Path $targetDir "7z.dll") -Force

      - name: テスト実行
        run: dotnet test Lhamiel.slnx --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      - name: テスト結果をアップロード
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-Release
          path: '**/TestResults/*.trx'
          retention-days: 1

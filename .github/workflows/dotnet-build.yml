name: Dotnet Build

on:
  push:
    branches-ignore:
      - releases
  pull_request:
    branches-ignore:
      - releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Lhamiel.slnx

      - name: Build
        run: dotnet build Lhamiel.slnx --configuration Release --no-restore

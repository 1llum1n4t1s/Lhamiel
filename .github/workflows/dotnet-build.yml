name: Dotnet Build

on:
  push:
    branches-ignore:
      - releases
  pull_request:
    branches-ignore:
      - releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Lhamiel.slnx

      - name: Build
        run: dotnet build Lhamiel.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Lhamiel.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: false

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always()
        with:
          files: |
            **/test-results.trx

      - name: Code Quality - Format Check
        run: dotnet format Lhamiel.slnx --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: Security Scan - Dependency Check
        run: |
          dotnet list package --vulnerable --include-transitive
          dotnet list package --deprecated
        continue-on-error: true

name: .NET ビルド

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

  test:
    name: テスト実行
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v4.3.1
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25
        with:
          dotnet-version: '10.0.x'

      - name: x64 ビルド成果物をダウンロード
        # actions/download-artifact@v4.1.8
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: lhamiel.win-x64
          path: publish

      # 7z.dll は 1llum1n4t1s.Sevenzip NuGet パッケージに同梱済み。
      # dotnet test が実行時に NuGet キャッシュから解決する。

      - name: テスト実行
        run: dotnet test Lhamiel.slnx --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true

      - name: テスト結果をアップロード
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        if: always()
        with:
          name: test-results-Release
          path: '**/TestResults/*.trx'
          retention-days: 1

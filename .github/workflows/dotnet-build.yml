name: .NET ビルド

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

  test:
    name: テスト実行
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v4.3.1
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: x64 ビルド成果物をダウンロード
        # actions/download-artifact@v4.1.8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lhamiel.win-x64
          path: publish

      # 7z.dll は 1llum1n4t1s.Sevenzip NuGet パッケージに同梱済み。
      # dotnet test が実行時に NuGet キャッシュから解決する。

      - name: テスト実行（カバレッジ付き）
        run: >-
          dotnet test Lhamiel.slnx
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings src/Lhamiel.Tests.Unit/coverlet.runsettings

      - name: テスト結果をアップロード
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: test-results-Release
          path: '**/TestResults/*.trx'
          retention-days: 1

      - name: カバレッジレポートをアップロード
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-report
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7

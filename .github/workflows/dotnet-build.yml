name: .NET ビルド

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

# 同じ PR の古い実行は新しい push で打ち切る。main への push は run ごとに独立して完走する。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  # build（公開物の検査）と test は互いの成果物を使わないため並列に走らせる。
  test:
    name: テスト実行
    uses: ./.github/workflows/test.yml

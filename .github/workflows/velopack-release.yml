name: Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  version:
    name: バージョン取得
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      framework: ${{ steps.version.outputs.framework }}
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: バージョン情報を出力
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          framework=$(grep -oP '(?<=<TargetFramework>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "framework=$framework" >> "$GITHUB_OUTPUT"

  velopack:
    needs: [build, version]
    name: Velopack ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            label: windows-x64
            channel: win
          - runtime: win-arm64
            label: windows-arm64
            channel: win-arm64
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v4.3.1
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25
        with:
          dotnet-version: '10.0.x'

      - name: ビルド成果物をダウンロード
        # actions/download-artifact@v4.1.8
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: lhamiel.${{ matrix.runtime }}
          path: publish

      - name: README.txt を生成
        shell: pwsh
        run: |
          $readmeMd = "README.md"
          $readmeTxt = Join-Path "publish" "README.txt"

          $content = Get-Content -Path $readmeMd -Raw -Encoding utf8
          $content = $content -replace '!\[.*?\]\(.*?\)\r?\n?', ''
          $content = $content -replace '<img[^>]*/?>\r?\n?', ''
          $content = $content -replace '\[([^\]]+)\]\(([^\)]+)\)', '$1 ($2)'
          $content = $content -replace '^#{1,6}\s+', '' -replace '(?m)^#{1,6}\s+', ''
          $content = $content -replace '\*\*([^*]+)\*\*', '$1'
          $content = $content -replace '`([^`]+)`', '$1'
          $content = $content -replace '^\| .+\|$', '' -replace '(?m)^\| .+\|$', ''
          $content = $content -replace '^\|[-: ]+\|$', '' -replace '(?m)^\|[-: ]+\|$', ''
          $content = $content -replace '(?m)^>\s*', ''
          $content = $content -replace '\r?\n{3,}', "`n`n"

          [System.IO.File]::WriteAllText($readmeTxt, $content.Trim(), [System.Text.Encoding]::UTF8)
          Write-Host "README.txt generated"

      - name: Velopack CLI をインストール
        # サプライチェーン攻撃防止のため NuGet パッケージ側の Velopack と
        # 同一バージョンに固定する（バージョン未指定だと最新版取得でリスクあり）
        run: dotnet tool install --global vpk --version 0.0.1369-g1d5c984

      - name: Velopack パッケージを作成
        shell: pwsh
        run: |
          $iconPath = Join-Path "src" "Lhamiel" "icon" "app.ico"

          vpk pack `
            --packId Lhamiel `
            --packVersion ${{ needs.version.outputs.version }} `
            --packTitle "Lhamiel" `
            --packAuthors "Lhamiel" `
            --mainExe Lhamiel.exe `
            --icon $iconPath `
            --packDir publish `
            --outputDir artifacts `
            --channel ${{ matrix.channel }} `
            --shortcuts "StartMenu,Desktop"

      - name: Velopack 成果物をアップロード
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: velopack.${{ matrix.label }}
          path: artifacts/*
          retention-days: 1

  release:
    needs: [velopack, version]
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # /rere #26: 旧実装は「既存リリース削除 → 再作成」だったため、
      # マルチアーティファクト（x64 + ARM64）配信中に失敗するとユーザーから
      # アクセス可能な状態で「タグ消失 / 部分パッケージ」になる経路があった。
      # draft 方式に変更し、すべてのアップロード完了後にのみ publish する。
      # 既存リリース（publish 済み）は残してロールバック可能性を保つ。
      - name: 失敗残存 draft をクリーンアップ（同タグ再実行時の冪等性）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # 既存タグが draft の場合のみ削除する。publish 済みは保持。
          # --cleanup-tag を付けないと git tag が残り、後続の `gh release create` が
          # stale tag（前回失敗時の古いコミット）を流用してしまうため、必ずタグごと削除する。
          if gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null | grep -q '^true$'; then
            echo "既存 draft $TAG を削除して再作成（タグごと削除）..."
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "既存 draft なし、または既に publish 済み: $TAG"
            # publish 済みでない（リリース無し）かつ git tag だけ残っているケース
            # （`gh release create` の途中失敗等）でも stale tag を流用しないよう削除
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
                echo "リリース未作成だが孤立タグ $TAG が残存 → 削除"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
              fi
            fi
          fi

      - name: Velopack 成果物をダウンロード
        # actions/download-artifact@v4.1.8
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: velopack.*
          path: packages
          merge-multiple: true

      - name: 成果物を確認
        run: |
          echo "パッケージ一覧:"
          ls -lh packages/

      # publish 済みリリース存在ケース（同 release/x.y.z ブランチへの再 push 時のホットフィックス用途）
      # は --clobber でアーティファクトを直接置換するため、x64 と arm64 の同期ウィンドウ内で部分配信される
      # 可能性が残る。draft 経路ほどの安全性は保証されないが、新規リリース時は draft 経路に乗るため
      # 通常運用ではこの分岐に入らない。
      - name: draft リリースを作成しアップロード
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "既存 publish 済みリリース $TAG が存在 → アーティファクトを --clobber で更新"
            gh release upload "$TAG" packages/* --clobber
          else
            echo "新規 draft リリース $TAG を作成"
            gh release create "$TAG" \
              --draft \
              -t "Lhamiel $VERSION" \
              --generate-notes
            gh release upload "$TAG" packages/*
          fi

      - name: 全アップロード完了後に draft を公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # publish 済みの場合は no-op、draft の場合のみ公開状態に切替（idempotent）
          gh release edit "$TAG" --draft=false

name: Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  version:
    name: バージョン取得
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      framework: ${{ steps.version.outputs.framework }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: バージョン情報を出力
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          framework=$(grep -oP '(?<=<TargetFramework>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "framework=$framework" >> "$GITHUB_OUTPUT"

  velopack:
    needs: [build, version]
    name: Velopack ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            label: windows-x64
            channel: win
          - runtime: win-arm64
            label: windows-arm64
            channel: win-arm64
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: ビルド成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          name: lhamiel.${{ matrix.runtime }}
          path: publish

      - name: README.txt を生成
        shell: pwsh
        run: |
          $readmeMd = "README.md"
          $readmeTxt = Join-Path "publish" "README.txt"

          $content = Get-Content -Path $readmeMd -Raw -Encoding utf8
          $content = $content -replace '!\[.*?\]\(.*?\)\r?\n?', ''
          $content = $content -replace '<img[^>]*/?>\r?\n?', ''
          $content = $content -replace '\[([^\]]+)\]\(([^\)]+)\)', '$1 ($2)'
          $content = $content -replace '^#{1,6}\s+', '' -replace '(?m)^#{1,6}\s+', ''
          $content = $content -replace '\*\*([^*]+)\*\*', '$1'
          $content = $content -replace '`([^`]+)`', '$1'
          $content = $content -replace '^\| .+\|$', '' -replace '(?m)^\| .+\|$', ''
          $content = $content -replace '^\|[-: ]+\|$', '' -replace '(?m)^\|[-: ]+\|$', ''
          $content = $content -replace '(?m)^>\s*', ''
          $content = $content -replace '\r?\n{3,}', "`n`n"

          [System.IO.File]::WriteAllText($readmeTxt, $content.Trim(), [System.Text.Encoding]::UTF8)
          Write-Host "README.txt generated"

      - name: Velopack CLI をインストール
        run: dotnet tool install --global vpk

      - name: Velopack パッケージを作成
        shell: pwsh
        run: |
          $iconPath = Join-Path "src" "Lhamiel" "icon" "app.ico"

          vpk pack `
            --packId Lhamiel `
            --packVersion ${{ needs.version.outputs.version }} `
            --packTitle "Lhamiel" `
            --packAuthors "Lhamiel" `
            --mainExe Lhamiel.exe `
            --icon $iconPath `
            --packDir publish `
            --outputDir artifacts `
            --channel ${{ matrix.channel }} `
            --shortcuts "StartMenu,Desktop"

      - name: Velopack 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: velopack.${{ matrix.label }}
          path: artifacts/*

  release:
    needs: [velopack, version]
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 既存リリースを削除
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "既存リリース $TAG を削除..."
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "既存リリースなし: $TAG"
          fi

      - name: Velopack 成果物をダウンロード
        uses: actions/download-artifact@v4
        with:
          pattern: velopack.*
          path: packages
          merge-multiple: true

      - name: 成果物を確認
        run: |
          echo "パッケージ一覧:"
          ls -lh packages/

      - name: リリースを作成
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            -t "Lhamiel $VERSION" \
            --generate-notes
          gh release upload "$TAG" packages/*

name: Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  version:
    name: バージョン取得
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      framework: ${{ steps.version.outputs.framework }}
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: バージョン情報を出力
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          framework=$(grep -oP '(?<=<TargetFramework>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          echo "framework=$framework" >> "$GITHUB_OUTPUT"

  velopack:
    needs: [build, version]
    name: Velopack ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - runtime: win-x64
            label: windows-x64
            channel: win
          - runtime: win-arm64
            label: windows-arm64
            channel: win-arm64
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v4.3.1
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: ビルド成果物をダウンロード
        # actions/download-artifact@v4.1.8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: lhamiel.${{ matrix.runtime }}
          path: publish

      - name: README.txt を生成
        shell: pwsh
        run: |
          $readmeMd = "README.md"
          $readmeTxt = Join-Path "publish" "README.txt"

          $content = Get-Content -Path $readmeMd -Raw -Encoding utf8
          $content = $content -replace '!\[.*?\]\(.*?\)\r?\n?', ''
          $content = $content -replace '<img[^>]*/?>\r?\n?', ''
          $content = $content -replace '\[([^\]]+)\]\(([^\)]+)\)', '$1 ($2)'
          $content = $content -replace '^#{1,6}\s+', '' -replace '(?m)^#{1,6}\s+', ''
          $content = $content -replace '\*\*([^*]+)\*\*', '$1'
          $content = $content -replace '`([^`]+)`', '$1'
          $content = $content -replace '^\| .+\|$', '' -replace '(?m)^\| .+\|$', ''
          $content = $content -replace '^\|[-: ]+\|$', '' -replace '(?m)^\|[-: ]+\|$', ''
          $content = $content -replace '(?m)^>\s*', ''
          $content = $content -replace '\r?\n{3,}', "`n`n"

          [System.IO.File]::WriteAllText($readmeTxt, $content.Trim(), [System.Text.Encoding]::UTF8)
          Write-Host "README.txt generated"

      - name: Velopack CLI をインストール
        # サプライチェーン攻撃防止のため NuGet パッケージ側の Velopack と
        # 同一バージョンに固定する（バージョン未指定だと最新版取得でリスクあり）
        run: dotnet tool install --global vpk --version 0.0.1369-g1d5c984

      - name: Velopack パッケージを作成
        shell: pwsh
        run: |
          $iconPath = Join-Path "src" "Lhamiel" "icon" "app.ico"

          vpk pack `
            --packId Lhamiel `
            --packVersion ${{ needs.version.outputs.version }} `
            --packTitle "Lhamiel" `
            --packAuthors "Lhamiel" `
            --mainExe Lhamiel.exe `
            --icon $iconPath `
            --packDir publish `
            --outputDir artifacts `
            --channel ${{ matrix.channel }} `
            --shortcuts "StartMenu,Desktop"

      - name: Velopack 成果物をアップロード
        # actions/upload-artifact@v4.4.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: velopack.${{ matrix.label }}
          path: artifacts/*
          retention-days: 1

  r2-upload:
    needs: [velopack, version]
    name: R2 Upload
    runs-on: ubuntu-latest
    # R2 が唯一の配信元 (通常リリースは /vava → R2 単独)。
    # 旧 GithubSource クライアント (v1.0.167 以下) の移行用 "踏み台" は
    # /transfer-cf 移行作業時に GitHub Releases へ 1 バージョンだけ別途 publish 済み
    # (継続的な GitHub Releases 配信はしない)。
    # 配信元の R2 バケットの全権はこの job のみが必要。最小権限化のため明示的に絞る。
    permissions:
      contents: read
    steps:
      - name: Velopack 成果物をダウンロード
        # actions/download-artifact@v4.1.8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: velopack.*
          path: packages
          merge-multiple: true

      - name: 成果物を確認
        run: |
          echo "パッケージ一覧:"
          ls -lh packages/

      - name: Node.js セットアップ (wrangler 4.x が Node.js >=22 を要求)
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: wrangler CLI をインストール
        # サプライチェーン攻撃防止のため明示的にバージョン固定する
        # （バージョン未指定 / @latest 指定だと最新版自動取得でリスクあり）。
        run: npm install -g wrangler@4.92.0

      # Velopack 成果物の R2 アップロード仕様:
      # - releases.{channel}.json (manifest) は同 channel の旧版を上書き
      #   → 新リリース後、クライアントはここから新 nupkg URL を取得する
      # - *.nupkg (full / delta) は put のみで既存ファイルは触らない
      #   → 過去バージョンの nupkg を残すことで delta 連鎖と緊急ロールバックを維持
      # wrangler r2 object put は冪等で常に上書き put するため、同タグの再 push でも問題ない。
      - name: R2 バケット lhamiel-updates にアップロード
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          uploaded=0
          for f in packages/*; do
            name=$(basename "$f")
            echo "::group::Upload $name"
            wrangler r2 object put "lhamiel-updates/$name" --file="$f" --remote
            echo "::endgroup::"
            uploaded=$((uploaded + 1))
          done
          echo "✅ R2 アップロード完了: $uploaded ファイル"

      # 配信先 manifest の即時取得確認（CDN/edge への伝播チェック）。
      # 5xx / 404 が出る場合はカスタムドメイン未 active / DNS 反映待ちの可能性。
      - name: 配信確認 (releases.{channel}.json の HTTP 200 を検証)
        run: |
          set -euo pipefail
          base="https://lhamiel.nephilim.jp"
          for channel in win win-arm64; do
            url="${base}/releases.${channel}.json"
            echo "Checking: $url"
            # max-time 30s, fail on 4xx/5xx, retry 3 times w/ backoff (CDN 伝播待ち救済)
            curl --fail --silent --show-error --max-time 30 \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 -o /dev/null -w "HTTP %{http_code} (%{size_download} bytes)\n" \
                 "$url"
          done

      # 旧バージョン nupkg のクリーンアップ (Aggressive 戦略):
      # - releases.{channel}.json (manifest) に含まれない nupkg を削除
      # - Setup.exe / Portable.zip / RELEASES / assets.*.json は固定ファイル名で
      #   上書きされる Velopack 内部ファイル & ランディング DL 用なので保持
      # - 万一 manifest 取得が失敗 / 配信確認をパスしていない場合はこのステップが
      #   そもそも走らない (needs: 直前の配信確認ステップが OK が前提)
      # - 削除対象を「.nupkg かつ manifest 外」に絞ることで、想定外のファイル
      #   (誰かが手動 put した object) を誤って消さない安全側設計
      # - API: Cloudflare V4 (既存 CLOUDFLARE_API_TOKEN で動く / 追加 secret 不要)
      # - keep_map は **ローカル packages/ の manifest** から構築する (Codex P1 指摘対応):
      #   public endpoint から fetch すると CDN/R2 の伝播タイミング次第で「アップロード前の
      #   旧 manifest」が返る race condition があり、新 nupkg が keep_map に入らないまま
      #   削除されてしまう経路があった。
      - name: 旧バージョン nupkg を削除 (manifest 外をクリーンアップ)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/lhamiel-updates"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # 1. ローカル packages/ の manifest (=今アップロードしたものと同一) から keep set 構築。
          #    CDN/R2 の伝播遅延に依存しないため、リリース直後に新 nupkg を誤削除する race を回避。
          declare -A keep_map
          shopt -s nullglob
          local_manifests=(packages/releases.*.json)
          shopt -u nullglob

          if [[ "${#local_manifests[@]}" -eq 0 ]]; then
            echo "::error::packages/releases.*.json が見つかりません。Velopack 成果物のダウンロードに失敗している可能性があります。"
            exit 1
          fi

          for manifest_path in "${local_manifests[@]}"; do
            echo "Reading local manifest: $manifest_path"
            while IFS= read -r filename; do
              if [[ -n "$filename" && "$filename" != "null" ]]; then
                keep_map["$filename"]=1
              fi
            done < <(jq -r '.Assets[]?.FileName // empty' "$manifest_path")
          done

          echo "::group::manifest 内の保持対象 nupkg (${#keep_map[@]} files)"
          for k in "${!keep_map[@]}"; do echo "  $k"; done | sort
          echo "::endgroup::"

          # 2. R2 上の全 object を cursor ページネーション付きで取得
          #    継続判定は result_info.is_truncated を明示利用 (CodeRabbit 指摘で意図を明確化)
          all_keys=()
          cursor=""
          while true; do
            if [[ -n "$cursor" ]]; then
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000&cursor=${cursor}" -H "$auth_header")
            else
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000" -H "$auth_header")
            fi
            while IFS= read -r k; do
              [[ -n "$k" ]] && all_keys+=("$k")
            done < <(echo "$resp" | jq -r '.result[]?.key')

            truncated=$(echo "$resp" | jq -r '.result_info.is_truncated // false')
            [[ "$truncated" != "true" ]] && break
            cursor=$(echo "$resp" | jq -r '.result_info.cursor // ""')
            [[ -z "$cursor" || "$cursor" == "null" ]] && break
          done

          echo "::group::R2 内全オブジェクト (${#all_keys[@]} files)"
          printf '  %s\n' "${all_keys[@]}"
          echo "::endgroup::"

          # 3. 削除対象判定:
          #    - 拡張子 .nupkg のもののみ対象 (.exe / .zip / .json / RELEASES 等は保護)
          #    - keep_map に含まれないものを削除
          to_delete=()
          for key in "${all_keys[@]}"; do
            # nupkg 以外は安全側で保持
            [[ "$key" != *.nupkg ]] && continue
            # manifest に含まれていれば保持
            [[ -n "${keep_map[$key]:-}" ]] && continue
            to_delete+=("$key")
          done

          if [[ "${#to_delete[@]}" -eq 0 ]]; then
            echo "✅ 削除対象なし - R2 上の全 nupkg が manifest に含まれています"
            exit 0
          fi

          echo "::group::削除対象 (${#to_delete[@]} files)"
          printf '  %s\n' "${to_delete[@]}"
          echo "::endgroup::"

          # 4. 一個ずつ DELETE
          #    --max-time 30 でハング防止 (他の curl 呼び出しと統一、CodeRabbit 指摘対応)
          deleted=0
          failed=0
          for key in "${to_delete[@]}"; do
            # URL エンコード (ファイル名は通常 ASCII だが念のため)
            encoded=$(jq -nr --arg k "$key" '$k|@uri')
            resp=$(curl --silent --max-time 30 -X DELETE "${api}/objects/${encoded}" -H "$auth_header")
            success=$(echo "$resp" | jq -r '.success')
            if [[ "$success" == "true" ]]; then
              echo "  🗑️  Deleted: $key"
              deleted=$((deleted + 1))
            else
              echo "  ❌ Failed: $key"
              echo "$resp" | jq -r '.errors[]?.message' | sed 's/^/      /'
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "🧹 R2 クリーンアップ完了: $deleted / ${#to_delete[@]} 削除  (失敗: $failed)"
          # 失敗があってもリリース自体は成功扱い (削除失敗は次回リリースで再試行されるため)
          # ただし全件失敗の場合はワークフロー失敗にして気付けるようにする
          if [[ "$failed" -gt 0 && "$deleted" -eq 0 ]]; then
            echo "::error::すべての削除が失敗しました。API token の権限・bucket 名を確認してください。"
            exit 1
          fi

name: Velopack リリース作成

on:
  push:

permissions:
  contents: write

jobs:
  build-release:
    name: Velopack リリース (${{ matrix.rid }})
    runs-on: windows-latest
    if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            channel: win
            sevenzip_suffix: x64
            platform_target: x64
          - rid: win-arm64
            channel: win-arm64
            sevenzip_suffix: arm64
            platform_target: ARM64
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 依存関係を復元
        run: dotnet restore Lhamiel.slnx

      - name: リリースバージョンを設定
        shell: pwsh
        run: |
          # Directory.Build.props からバージョンを読み取る
          $path = "Directory.Build.props"
          $version = $null

          if (Test-Path $path) {
            $content = Get-Content -Path $path -Raw
            if ($content -match '<Version>([^<]+)</Version>') {
              $version = $matches[1]
              Write-Host "Version read from: $path"
            }
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Version not found in $path"
            exit 1
          }

          Write-Host "Version found: $version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_VERSION=$version" -Encoding utf8

      - name: ターゲットフレームワークを取得
        shell: pwsh
        run: |
          # Directory.Build.props からターゲットフレームワークを読み取る
          $path = "Directory.Build.props"
          $targetFramework = $null

          if (Test-Path $path) {
            $content = Get-Content -Path $path -Raw
            if ($content -match '<TargetFramework>([^<]+)</TargetFramework>') {
              $targetFramework = $matches[1]
              Write-Host "TargetFramework read from: $path"
            }
          }

          if ([string]::IsNullOrWhiteSpace($targetFramework)) {
            Write-Error "TargetFramework not found in $path"
            exit 1
          }

          Write-Host "TargetFramework found: $targetFramework"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TARGET_FRAMEWORK=$targetFramework" -Encoding utf8

      - name: 7z.dll をダウンロード
        shell: pwsh
        run: |
          $sevenZipVersion = "2600"
          $rid = "${{ matrix.rid }}"
          $suffix = "${{ matrix.sevenzip_suffix }}"
          $url = "https://www.7-zip.org/a/7z${sevenZipVersion}-${suffix}.exe"
          $tempDir = Join-Path $env:RUNNER_TEMP "7z-extract"
          $installerPath = Join-Path $env:RUNNER_TEMP "7z-installer.exe"
          $targetDir = Join-Path "lib" "native" $rid

          Write-Host "7-Zip $rid をダウンロード: $url"
          Invoke-WebRequest -Uri $url -OutFile $installerPath -UseBasicParsing

          Write-Host "7z.dll を展開..."
          & "C:\Program Files\7-Zip\7z.exe" x $installerPath -o"$tempDir" -y | Out-Null

          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
          Copy-Item -Path (Join-Path $tempDir "7z.dll") -Destination (Join-Path $targetDir "7z.dll") -Force

          $dllPath = Join-Path $targetDir "7z.dll"
          if (Test-Path $dllPath) {
            $size = [math]::Round((Get-Item $dllPath).Length / 1MB, 2)
            Write-Host "7z.dll ($rid) を配置完了: $dllPath (${size} MB)"
          } else {
            Write-Error "7z.dll の配置に失敗しました"
            exit 1
          }

      - name: アプリを公開ビルド
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $publishDir = Join-Path "src" "Lhamiel" "bin" "Release" "$env:TARGET_FRAMEWORK" "$rid" "publish"
          if (Test-Path $publishDir) {
            Remove-Item -Path $publishDir -Recurse -Force
          }

          Write-Host "Building and publishing application..."
          Write-Host "Target Framework: $env:TARGET_FRAMEWORK"
          Write-Host "Runtime Identifier: $rid"
          Write-Host "Publish Dir: $publishDir"
          dotnet publish "src/Lhamiel/Lhamiel.csproj" `
            -c Release `
            -r $rid `
            -p:PlatformTarget=${{ matrix.platform_target }} `
            -o $publishDir

          if ($LASTEXITCODE -ne 0) {
            Write-Error "dotnet publish failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "Publish directory contents:"
          Get-ChildItem -Path $publishDir -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }

          $exePath = Join-Path $publishDir "Lhamiel.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Lhamiel.exe not found at: $exePath"
            exit 1
          }
          Write-Host "Successfully built: $exePath"

          # 7z.dll が publish に含まれているか確認
          $dllPath = Join-Path $publishDir "7z.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "7z.dll not found in publish directory: $dllPath"
            exit 1
          }
          Write-Host "7z.dll confirmed in publish directory"

      - name: README.txt を生成して publish に配置
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $publishDir = Join-Path "src" "Lhamiel" "bin" "Release" "$env:TARGET_FRAMEWORK" "$rid" "publish"
          $readmeMd = "README.md"
          $readmeTxt = Join-Path $publishDir "README.txt"

          if (-not (Test-Path $readmeMd)) {
            Write-Error "README.md not found"
            exit 1
          }

          # Markdown → プレーンテキスト変換
          $content = Get-Content -Path $readmeMd -Raw -Encoding utf8
          $content = $content -replace '!\[.*?\]\(.*?\)\r?\n?', ''
          $content = $content -replace '<img[^>]*/?>\r?\n?', ''
          $content = $content -replace '\[([^\]]+)\]\(([^\)]+)\)', '$1 ($2)'
          $content = $content -replace '^#{1,6}\s+', '' -replace '(?m)^#{1,6}\s+', ''
          $content = $content -replace '\*\*([^*]+)\*\*', '$1'
          $content = $content -replace '`([^`]+)`', '$1'
          $content = $content -replace '^\| .+\|$', '' -replace '(?m)^\| .+\|$', ''
          $content = $content -replace '^\|[-: ]+\|$', '' -replace '(?m)^\|[-: ]+\|$', ''
          $content = $content -replace '(?m)^>\s*', ''
          $content = $content -replace '\r?\n{3,}', "`n`n"

          [System.IO.File]::WriteAllText($readmeTxt, $content.Trim(), [System.Text.Encoding]::UTF8)
          Write-Host "README.txt generated at: $readmeTxt"

      - name: Velopack CLI をインストール
        shell: pwsh
        run: |
          dotnet tool install --global vpk
          $toolsPath = "$env:USERPROFILE\.dotnet\tools"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $toolsPath -Encoding utf8
          Write-Host "Velopack CLI installed to: $toolsPath"
          Write-Host "PATH environment updated"

      - name: Velopack パッケージを作成
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $publishDir = Join-Path "src" "Lhamiel" "bin" "Release" "$env:TARGET_FRAMEWORK" "$rid" "publish"
          $outputDir = "artifacts"
          $iconPath = Join-Path "src" "Lhamiel" "icon" "app.ico"

          if (-not (Test-Path $publishDir)) {
            Write-Error "Publish directory not found: $publishDir"
            exit 1
          }

          if (Test-Path $outputDir) {
            Remove-Item -Path $outputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          Write-Host "Creating Velopack package..."
          Write-Host "  Pack ID: Lhamiel"
          Write-Host "  Version: $env:RELEASE_VERSION"
          Write-Host "  Title: Lhamiel"
          Write-Host "  Channel: ${{ matrix.channel }}"
          Write-Host "  Main EXE: Lhamiel.exe"
          Write-Host "  Publish Dir: $publishDir"
          Write-Host "  Output Dir: $outputDir"
          Write-Host "  Icon: $iconPath"

          vpk pack `
            --packId Lhamiel `
            --packVersion $env:RELEASE_VERSION `
            --packTitle "Lhamiel" `
            --packAuthors "Lhamiel" `
            --mainExe Lhamiel.exe `
            --icon $iconPath `
            --packDir $publishDir `
            --outputDir $outputDir `
            --shortcuts "StartMenu,Desktop" `
            --channel ${{ matrix.channel }}

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vpk pack failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "Velopack パッケージ作成完了"
          Write-Host "Artifacts directory contents:"
          if (Test-Path $outputDir) {
            Get-ChildItem -Path $outputDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Error "Artifacts directory was not created"
            exit 1
          }

      - name: リリースタグを決定
        shell: pwsh
        run: |
          # x64 は従来通りバージョンのみ、ARM64 はサフィックス付き
          $channel = "${{ matrix.channel }}"
          if ($channel -eq "win") {
            $releaseTag = $env:RELEASE_VERSION
            $releaseName = "Lhamiel $env:RELEASE_VERSION"
          } else {
            $releaseTag = "$env:RELEASE_VERSION-$channel"
            $releaseName = "Lhamiel $env:RELEASE_VERSION ($channel)"
          }
          Write-Host "Release Tag: $releaseTag"
          Write-Host "Release Name: $releaseName"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_TAG=$releaseTag" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_NAME=$releaseName" -Encoding utf8

      - name: 既存リリースを削除
        shell: pwsh
        run: |
          $releaseTag = $env:RELEASE_TAG
          Write-Host "Checking for existing release with tag: $releaseTag"

          try {
            $releases = @(gh release list --repo "${{ github.repository }}" --json tagName,name --limit 100 | ConvertFrom-Json)

            $existingRelease = $releases | Where-Object { $_.tagName -eq $releaseTag } | Select-Object -First 1

            if ($existingRelease) {
              Write-Host "Found existing release: $($existingRelease.name) (tag: $($existingRelease.tagName))"
              Write-Host "Deleting release: $releaseTag"
              gh release delete $releaseTag --repo "${{ github.repository }}" --yes
              Write-Host "Release deleted successfully"
            } else {
              Write-Host "No existing release found for tag: $releaseTag"
            }
          } catch {
            Write-Host "Error checking releases: $_"
            gh release delete $releaseTag --repo "${{ github.repository }}" --yes --if-exists 2>$null || Write-Host "No release to delete (expected for new releases)"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub Releases にアップロード
        shell: pwsh
        run: |
          $outputDir = "artifacts"

          if (-not (Test-Path $outputDir)) {
            Write-Error "Artifacts directory not found: $outputDir"
            exit 1
          }

          Write-Host "GitHub Releases へのアップロードを開始..."
          Write-Host "Repository: ${{ github.repository }}"
          Write-Host "Release Tag: $env:RELEASE_TAG"
          Write-Host "Release Name: $env:RELEASE_NAME"
          Write-Host "Channel: ${{ matrix.channel }}"
          Write-Host "Artifacts directory contents:"
          if (Get-ChildItem -Path $outputDir -Recurse -ErrorAction SilentlyContinue) {
            Get-ChildItem -Path $outputDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "  (empty)"
          }

          $repoUrl = "https://github.com/${{ github.repository }}"

          vpk upload github `
            --repoUrl $repoUrl `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir $outputDir `
            --channel ${{ matrix.channel }} `
            --publish `
            --releaseName $env:RELEASE_NAME `
            --tag $env:RELEASE_TAG

          if ($LASTEXITCODE -ne 0) {
            Write-Error "vpk upload failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "GitHub Releases へのアップロード完了"

name: テスト

# 回帰テスト（locked restore + Release テスト + カバレッジ）。呼び出し元:
# - dotnet-build.yml: main への push と PR
# - release.yml: 署名・R2 配信より前に必ず通し、失敗したら配信しない
# concurrency は呼び出し側の group と衝突して待ち合わせになるため、ここには置かない。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: テスト実行
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリをチェックアウト
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify R2 transfer fixtures
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: .NET SDK をセットアップ
        # actions/setup-dotnet@v6.1.0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          # ビルドに使う SDK はリポジトリ直下の global.json で固定し、ローカルと CI の暗黙 ILCompiler 版を揃える。
          global-json-file: global.json

      # 7z.dll は 1llum1n4t1s.Sevenzip NuGet パッケージに同梱済み。
      # dotnet test が実行時に NuGet キャッシュから解決する。

      - name: NuGet パッケージキャッシュを復元
        id: nuget-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/heads/release/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-test-${{ github.job }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Build.targets', '**/Directory.Packages.props', '**/packages*.lock.json', '**/global.json', '**/nuget.config', '**/NuGet.config', '**/NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-test-${{ github.job }}-
            ${{ runner.os }}-nuget-

      # 追跡対象 packages.lock.json は Kagayoi.Support をパッケージ参照する構成の正本。
      # CI は兄弟リポジトリを持たないが、ローカルと同じ復元グラフを明示して lockfile との不一致を失敗にする。
      # RID 付き publish（build.yml）は ARM64 で lock の RID セクションを書き換えるため locked-mode を掛けない。
      - name: 依存関係を復元（lockfile 固定）
        run: dotnet restore Lhamiel.slnx -p:KagayoiSupportClientUsePackage=true --locked-mode

      - name: NuGet パッケージキャッシュを保存
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: テスト実行（カバレッジ付き）
        run: >-
          dotnet test Lhamiel.slnx
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings src/Lhamiel.Tests.Unit/coverlet.runsettings

      - name: テスト結果をアップロード
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: test-results-Release
          path: '**/TestResults/*.trx'
          retention-days: 1

      - name: カバレッジレポートをアップロード
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-report
          path: '**/TestResults/**/coverage.cobertura.xml'
          retention-days: 7
